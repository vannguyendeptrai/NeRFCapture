name: Build unsigned IPA (NeRF Stream)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages (CycloneDDS, Zip)
        run: xcodebuild -resolvePackageDependencies -project NeRFCapture.xcodeproj -scheme NeRFCapture

      - name: Build for iPhone, unsigned (Sideloadly signs it)
        run: |
          set -o pipefail
          xcodebuild -project NeRFCapture.xcodeproj -scheme NeRFCapture \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tee build.log | grep -E "error:|warning: .*DDSWriter|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/NeRFCapture.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NeRFCapture.app Payload/
          zip -qr NeRFCapture-Stream.ipa Payload
          ls -la NeRFCapture-Stream.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NeRFCapture-Stream-ipa
          path: NeRFCapture-Stream.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
